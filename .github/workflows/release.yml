# Builds the pamflow installers for Windows, macOS (Apple Silicon + Intel)
# and Linux, and attaches them to a DRAFT GitHub release (nothing is public
# until you press "Publish" on the release page).
#
# Each installer holds the app plus the packed runtime (R, pamflow, Python,
# BirdNET, ffmpeg, pandoc). On first launch the app unpacks the runtime into
# the user's folder (src-tauri/src/setup.rs); no internet is needed.
#
# Start it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.

name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write          # to create the draft release and upload installers

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, platform: win-64,
              unpack: pixi-unpack-x86_64-pc-windows-msvc.exe, bundles: nsis }
          - { name: macOS (Apple Silicon), os: macos-15, platform: osx-arm64,
              unpack: pixi-unpack-aarch64-apple-darwin, bundles: "app,dmg" }
          - { name: macOS (Intel), os: macos-15-intel, platform: osx-64,
              unpack: pixi-unpack-x86_64-apple-darwin, bundles: "app,dmg" }
          - { name: Linux, os: ubuntu-22.04, platform: linux-64,
              unpack: pixi-unpack-x86_64-unknown-linux-musl, bundles: "appimage,deb" }
    defaults:
      run:
        shell: bash
    env:
      PACK: ${{ github.workspace }}/dist-runtime

    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      # ---- 1. the runtime, packed -------------------------------------------------
      - name: Build the runtime (pixi install)
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: runtime/pixi.toml
          locked: true
          cache: true
          cache-write: false

      - name: Add tuneR, seewave and pamflow
        working-directory: runtime
        run: pixi run setup-r

      - name: Smoke test
        working-directory: runtime
        run: pixi run smoke

      - name: Pack the runtime
        working-directory: runtime
        run: |
          mkdir -p "$PACK"
          pixi run python scripts/pack_extras.py "$PACK/r-extras.tar.gz"
          pixi exec pixi-pack --environment default --platform ${{ matrix.platform }} \
            --output-file "$PACK/runtime.tar" pixi.toml
          python3 scripts/runtime_id.py ${{ matrix.platform }} > "$PACK/runtime-id.txt" \
            || python scripts/runtime_id.py ${{ matrix.platform }} > "$PACK/runtime-id.txt"
          cat "$PACK/runtime-id.txt"

      - name: Add the unpacker (same version as pixi-pack)
        run: |
          ver=$(pixi exec pixi-pack --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          name=$([ "$RUNNER_OS" = "Windows" ] && echo pixi-unpack.exe || echo pixi-unpack)
          echo "pixi-pack $ver"
          curl -fsSL -o "$PACK/$name" \
            "https://github.com/Quantco/pixi-pack/releases/download/v$ver/${{ matrix.unpack }}" \
          || curl -fsSL -o "$PACK/$name" \
            "https://github.com/Quantco/pixi-pack/releases/latest/download/${{ matrix.unpack }}"
          chmod +x "$PACK/$name"
          ls -l "$PACK"

      - name: Remove the build copy of the runtime (disk space)
        run: rm -rf runtime/.pixi

      # ---- 2. the app -------------------------------------------------------------
      - name: Linux libraries for the app window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the interface's packages
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the installer and attach it to a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "pamflow __VERSION__"
          releaseBody: |
            Install, then start pamflow. The first start sets up the analysis
            engine once (1-5 minutes, no internet needed).
            Windows: if SmartScreen warns, choose "More info" -> "Run anyway".
            macOS: the first time, right-click pamflow -> Open.
          releaseDraft: true
          prerelease: true
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

      - name: Sizes
        if: always()
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            ls -l "$PACK" 2>/dev/null
            find src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) -exec ls -l {} \; 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
